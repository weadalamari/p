<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة إعادة توزيع الأجهزة الطبية</title>
<style>
:root{--pg:#E8E8ED;--bar:#fff;--bt:#000;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pg:#000;--bar:#16181C;--bt:#fff}}
:root[data-theme="dark"]{--pg:#000;--bar:#16181C;--bt:#fff}
html,body{height:100%;margin:0}
body{background:var(--pg);font-family:Arial,Helvetica,sans-serif;overflow:hidden;display:flex;flex-direction:column}
#st{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
#cv{width:1194px;height:834px;flex:none;position:relative;border-radius:22px;overflow:hidden;box-shadow:0 0 0 1px rgba(128,128,128,.3)}
.s{position:absolute;inset:0;display:none;flex-direction:column;padding:64px 72px}
.s.on{display:flex}
.l{background:#fff;color:#000;--inv:#fff;--cd:#F5F5F7;--bd:transparent;--mu:#6E6E73}
.d{background:#000;color:#fff;--inv:#000;--cd:#16181C;--bd:#2F3336;--mu:#8B98A5}
h1,h2{margin:0;font-weight:700;letter-spacing:-1.5px}
h1{font-size:92px;line-height:1.15}h2{font-size:60px;margin-bottom:8px}
.sub{font-size:24px;color:var(--mu);margin:0 0 22px;line-height:1.5}
p{margin:0;font-size:22px;line-height:1.6}h3{margin:0 0 6px;font-size:28px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:24px;padding:22px 26px}
.g{display:grid;gap:16px}
svg{display:block;overflow:visible}svg .ik{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.nd{cursor:pointer}.nd circle{fill:none;stroke:currentColor;stroke-width:1.5;transition:.3s}.nd.on circle{fill:currentColor}.nd.on .ik{stroke:var(--inv)}
.ln{stroke:var(--mu);stroke-width:2;stroke-dasharray:6 8;animation:da 1.2s linear infinite}@keyframes da{to{stroke-dashoffset:-28}}
.pl{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.pl button,.bt{font:inherit;font-size:20px;color:inherit;background:none;border:1px solid var(--mu);border-radius:999px;padding:9px 22px;cursor:pointer;transition:.25s}
.pl button.on,.bt{background:currentColor}
.pl button.on span,.bt span{color:var(--inv)}
.tag{display:inline-block;border:1px solid var(--mu);border-radius:999px;padding:4px 16px;font-size:17px}
.st{display:flex;flex-direction:column;align-items:center;gap:10px;flex:1;cursor:pointer;opacity:.4;transition:.3s;text-align:center}.st.on{opacity:1}
.st i{width:56px;height:56px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-style:normal;font-size:26px;font-weight:700}.st.on i{background:currentColor}.st.on i b{color:var(--inv)}
.bar{transform-origin:bottom;transform-box:fill-box;transform:scaleY(0);transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}.on .bar{transform:scaleY(1)}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.s.on h1,.s.on h2,.s.on .cd,.s.on svg,.s.on .pl{animation:up .7s both}.s.on .cd:nth-child(2){animation-delay:.1s}.s.on .cd:nth-child(3){animation-delay:.2s}.s.on .cd:nth-child(4){animation-delay:.3s}
#bar{height:56px;background:var(--bar);color:var(--bt);display:flex;align-items:center;justify-content:center;gap:16px;font-size:17px;flex:none}
#bar button{border:1px solid currentColor;background:none;color:inherit;font-size:20px;border-radius:999px;width:48px;height:36px;cursor:pointer}
#pr{width:220px;height:4px;background:rgba(128,128,128,.35);border-radius:2px;overflow:hidden}#pr i{display:block;height:100%;background:currentColor;width:0;float:right;transition:.4s}
</style>
</head>
<body>
<div id="st"><div id="cv"></div></div>
<div id="bar"><button id="nx" aria-label="التالي">›</button><span id="ct"></span><div id="pr"><i></i></div><button id="pv" aria-label="السابق">‹</button><button id="fs" aria-label="ملء الشاشة">⛶</button></div>
<script>
const P={box:"M16.5 9.4l-9-5.19M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16zM3.27 6.96L12 12.01l8.73-5.05M12 22.08V12",
trash:"M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2",
usd:"M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6",
hosp:"M3 21h18M5 21V7l7-4 7 4v14M12 9v6M9 12h6",
ok:"M22 11.08V12a10 10 0 1 1-5.93-9.14M22 4L12 14.01l-3-3",
heart:"M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z",
user:"M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z",
truck:"M1 3h15v13H1zM16 8h4l3 3v5h-7zM5.5 21a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zM18.5 21a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z",
mon:"M2 3h20v14H2zM8 21h8M12 17v4",doc:"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M16 13H8M16 17H8",
cyc:"M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15",
wave:"M22 12h-4l-3 9L9 3l-3 9H2",drop:"M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z",
chair:"M10 4a1.5 1.5 0 1 0 .01 0M10 8v6h6l2 6M7 12a5.5 5.5 0 1 0 7 8",bed:"M2 4v16M2 8h18a2 2 0 0 1 2 2v10M2 17h20M6 8v9",
tool:"M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z",
leaf:"M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10zM2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12",
q:"M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"};
const g=(n,x,y,s)=>`<g class="ik" transform="translate(${x-s/2} ${y-s/2}) scale(${s/24})"><path d="${P[n]}"/></g>`;
const ic=(n,s=44)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" style="color:inherit"><g class="ik"><path d="${P[n]}"/></g></svg>`;
function flow(items,k){const W=1050,n=items.length;let o=`<svg viewBox="0 0 ${W} 230" width="100%">`;
 for(let i=0;i<n-1;i++){const x1=W-(i+.5)*W/n-56,x2=W-(i+1.5)*W/n+56;o+=`<line class="ln" x1="${x1}" y1="70" x2="${x2}" y2="70"/><path class="ik" d="M${x2+12} 60l-12 10 12 10" style="stroke:var(--mu)"/>`}
 items.forEach((t,i)=>{const x=W-(i+.5)*W/n;o+=`<g class="nd${i?'':' on'}" data-g="${k}" data-k="${i}"><circle cx="${x}" cy="70" r="50"/>${g(t[0],x,70,44)}<text x="${x}" y="158" text-anchor="middle" font-size="24" font-weight="700" fill="currentColor">${t[1]}</text><text x="${x}" y="190" text-anchor="middle" font-size="19" fill="var(--mu)">${t[2]||''}</text></g>`});return o+'</svg>'}
const TB={};
function tabs(k,a,cls=''){TB[k]=a;return `<div class="pl" data-tabs="${k}">${a.map((t,i)=>`<button class="${i?'':'on'}" data-g="${k}" data-k="${i}"><span>${t[0]}</span></button>`).join('')}</div><div class="cd ${cls}" id="pn-${k}" style="flex:1">${pn(k,0)}</div>`}
const pn=(k,i)=>{const t=TB[k][i];return `<h3>${t[1]}</h3>${t.slice(2).map(r=>`<p style="margin-top:10px">${r}</p>`).join('')}`};
const S=[
`<section class="s d" style="justify-content:center"><div style="color:#fff;margin-bottom:30px">${ic('heart',84)}</div><h1>منصة إعادة توزيع<br>الأجهزة الطبية</h1><p class="sub" style="margin-top:20px;font-size:30px">من الفائض إلى المحتاج. مشروع اجتماعي مستدام وربحي.</p></section>`,
`<section class="s l"><h2>أجهزة تُهدر. وناس تحتاج.</h2><p class="sub">الأجهزة موجودة والاحتياج موجود، لكن لا توجد حلقة وصل بينهما.</p>${flow([['box','جهاز بحالة جيدة','فائض عند مستشفى أو أسرة'],['trash','يُخزَّن أو يُتلَف','تكلفة وهدر'],['usd','جهاز جديد','الجمعية تشتريه بتكلفة أعلى']],'x')}<div class="cd" style="margin-top:16px"><h3>الحل</h3><p>منصة تتولى الربط والفحص والتعقيم والتوزيع الموثق قبل أن يصل الجهاز إلى المحتاج.</p></div></section>`,
`<section class="s d"><h2>الفكرة</h2><p class="sub">ربط المستشفيات والصيدليات بالجمعيات الخيرية لإعادة توزيع الأجهزة المستعملة بحالة جيدة أو الفائضة.</p><div class="g" style="grid-template-columns:repeat(4,1fr);flex:1">${[['chair','كراسي متحركة'],['drop','أجهزة السكر والمقاييس'],['wave','أجهزة التنفس'],['bed','الأسرّة الطبية']].map(r=>`<div class="cd" style="display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;text-align:center">${ic(r[0],80)}<h3 style="font-size:24px">${r[1]}</h3></div>`).join('')}</div><p style="margin-top:20px;font-size:28px;font-weight:700">المنصة هي «الحلقة الذكية» التي تقدم قيمة لكل الأطراف.</p></section>`,
`<section class="s l"><h2>من مبادرة خيرية إلى مشروع.</h2><p class="sub">الربح هنا وسيلة للاستمرار، وليس على حساب المحتاج.</p><div class="g" style="grid-template-columns:1fr 1fr;flex:1"><div class="cd"><h3>مبادرة خيرية فقط</h3><p>تعتمد غالباً على التبرعات وحدها.<br>قد تتوقف إذا قلّ التمويل.<br>بلا مصدر دخل يضمن الاستمرار.</p></div><div class="cd" style="background:#000;color:#fff"><h3>مشروع اجتماعي</h3><p>يحل مشكلة اجتماعية حقيقية.<br>يحقق إيراداً من خدمات للجهات المشاركة.<br>الإيراد يضمن استمرار الخدمة.<br>لا يأخذ مقابلاً من المحتاجين.</p></div></div></section>`,
`<section class="s d"><h2>كيف تعمل الدورة؟</h2><p class="sub">اضغط على أي طرف لترى ماذا يقدّم وماذا يحصل عليه.</p>${flow([['hosp','المتبرعون','مستشفيات وصيدليات'],['ok','المنصة','فحص وصيانة وتعقيم'],['heart','الجمعيات','توزيع موثق'],['user','المستفيد','المحتاج للجهاز']],'pt')}<div class="cd" id="pn-pt" style="flex:1;margin-top:10px"></div></section>`,
`<section class="s l"><h2>رحلة كرسي متحرك</h2><p class="sub">مثال توضيحي. اضغط على أي مرحلة، أو على «التالي».</p><div style="display:flex;gap:6px;margin-bottom:24px">${[1,2,3,4,5].map(i=>`<div class="st${i==1?' on':''}" data-g="jr" data-k="${i-1}"><i><b>${i}</b></i><p style="font-size:18px">${['المصدر','التسجيل','الفحص','الطلب','التسليم'][i-1]}</p></div>`).join('')}</div><div class="cd" id="pn-jr" style="flex:1"></div><div style="margin-top:16px"><button class="bt" data-next="jr"><span>التالي ←</span></button></div></section>`,
`<section class="s d"><h2>خمسة مصادر للدخل</h2><p class="sub">الإيراد من خدمات ذات قيمة للجهات المشاركة، وليس من المحتاجين.</p>${tabs('rv',[['اشتراك الجمعيات','اشتراك الجمعيات الخيرية','لوحة تحكم لإدارة الطلبات والتحقق من حالة الأجهزة وتتبع توزيعها.','يدفع: الجمعية، باشتراك رمزي شهري أو سنوي.'],['الصيانة','الصيانة وإعادة التأهيل','فحص وتعقيم وصيانة وتغليف قبل التسليم.','يدفع: الجمعية أو الداعمون، برسوم أقل بكثير من سعر الجديد.'],['التوصيل','اللوجستيات والتوصيل','استلام الأجهزة من المستشفيات والمنازل ونقلها للجمعية أو المستفيد.','يدفع: الجمعية أو التبرعات المباشرة عبر المنصة.'],['التقارير','تقارير الاستدامة','تقارير موثقة بكمية الأجهزة المُدوَّرة وأثرها البيئي والمجتمعي.','يدفع: المستشفيات والصيدليات والشركات الكبرى، برسوم سنوية.'],['قطع الغيار','عمولات قطع الغيار','توفير الأنابيب والبطاريات وأنابيب الأكسجين.','عبر شراكة مع الصيدليات والموردين، والمنصة تأخذ نسبة بسيطة.']])}</section>`,
`<section class="s l"><h2>مفاهيم نحتاجها</h2><div class="g" style="grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,1fr);flex:1;margin-top:14px;gap:12px">${[['الاقتصاد الدائري','إعادة استخدام الأشياء بدل رميها'],['المشروع الاجتماعي','يحل مشكلة ويحقق دخلاً يضمن استمراره'],['الخدمة بالاشتراك SaaS','برنامج عبر الإنترنت باشتراك'],['الاستدامة ESG','أثر المنشأة على البيئة والمجتمع'],['المسؤولية المجتمعية CSR','دور الشركات الإيجابي في المجتمع'],['النموذج الأولي MVP','أبسط نسخة تكفي لتجربة الفكرة'],['مذكرة التفاهم MoU','اتفاق مبدئي قبل التعاقد'],['الحلقة الذكية','جهة تربط الأطراف وتضيف قيمة']].map(r=>`<div class="cd" style="padding:12px 22px"><h3 style="font-size:23px;margin:0">${r[0]}</h3><p style="font-size:18px;color:var(--mu)">${r[1]}</p></div>`).join('')}</div></section>`,
`<section class="s d"><h2>القيمة الاقتصادية</h2><div style="display:flex;gap:30px;align-items:center;flex:1"><svg viewBox="0 0 560 330" width="560" style="flex:none">${[[100,'جهاز جديد',0],[40,'عبر المنصة (الأعلى)',1],[20,'عبر المنصة (الأدنى)',2]].map(b=>{const x=420-b[2]*190,h=b[0]*2.6;return `<rect class="bar" x="${x}" y="${280-h}" width="130" height="${h}" rx="14" fill="${b[2]?'#fff':'none'}" stroke="#fff" stroke-width="2" style="transition-delay:${b[2]*.2}s"/><text x="${x+65}" y="${268-h}" text-anchor="middle" font-size="26" font-weight="700" fill="#fff" dy="-4">${b[0]}%</text><text x="${x+65}" y="312" text-anchor="middle" font-size="17" fill="#8B98A5">${b[1]}</text>`}).join('')}<line x1="0" y1="280" x2="560" y2="280" stroke="#2F3336" stroke-width="2"/></svg><div><div style="font-size:110px;font-weight:700;letter-spacing:-3px;direction:ltr"><span class="cnt" data-to="60">0</span>–<span class="cnt" data-to="80">0</span>%</div><p style="font-size:24px">ما قد توفره الجمعيات من ميزانيات شراء الأجهزة الجديدة. تقدير أولي يحتاج تحققاً بالتجربة.</p></div></div><div class="g" style="grid-template-columns:repeat(3,1fr)">${[['المستشفيات','أقل تخزيناً وإتلافاً، وتصنيف استدامة أعلى'],['الجمعيات','مستفيدون أكثر بميزانية أقل'],['المجتمع','اقتصاد دائري ونفايات طبية أقل']].map(r=>`<div class="cd" style="padding:16px 22px"><h3 style="font-size:23px">${r[0]}</h3><p style="font-size:18px;color:var(--mu)">${r[1]}</p></div>`).join('')}</div></section>`,
`<section class="s l"><h2>الخطوات العملية</h2><p class="sub">الجهاز الطبي يُستخدم لرعاية إنسان، فالسلامة أولاً.</p><div class="g" style="grid-template-rows:repeat(3,1fr);flex:1">${[['دراسة الأنظمة والاشتراطات','لوائح إعادة تداول الأجهزة المستعملة والتعقيم مع هيئة الغذاء والدواء.'],['بناء نموذج مبسط MVP','منصة تربط جمعية واحدة بمستشفى أو صيدلية لتجربة الدورة وتحديد التكاليف.'],['عقد شراكات رئيسية','مذكرات تفاهم MoU مع جمعيات خيرية متخصصة في الرعاية الصحية.']].map((r,i)=>`<div class="cd" style="display:flex;align-items:center;gap:26px"><span style="font-size:70px;font-weight:700;letter-spacing:-2px;width:70px">${i+1}</span><div><h3>${r[0]}</h3><p style="color:var(--mu)">${r[1]}</p></div></div>`).join('')}</div></section>`,
`<section class="s d"><h2>أسئلة للنقاش</h2><div class="g" style="grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;flex:1;margin-top:16px">${['أي جهاز طبي تتوقعون أن يكون الطلب عليه أكبر؟ ولماذا؟','ما المخاطر لو وُزِّع جهاز بلا فحص وتعقيم؟','لو كنتم جمعية، هل تدفعون اشتراكاً رمزياً؟ وما الذي يقنعكم؟','ما مصدر الدخل السادس الذي يمكن إضافته؟'].map(q=>`<div class="cd" style="display:flex;flex-direction:column;justify-content:center;gap:16px">${ic('q',48)}<p style="font-size:26px;font-weight:700;line-height:1.5">${q}</p></div>`).join('')}</div></section>`,
`<section class="s l" style="justify-content:center"><div style="margin-bottom:26px">${ic('cyc',90)}</div><h1>أثر اجتماعي واقتصادي كبير.</h1><p class="sub" style="font-size:28px;margin-top:20px">المحتاج: جهاز بتكلفة أقل. القطاع الصحي: هدر أقل. المجتمع: اقتصاد دائري.</p><h2 style="margin-top:40px">شكراً لكم</h2></section>`];
TB.pt=[['','المتبرعون','<b>يقدّمون:</b> الأجهزة المستعملة بحالة جيدة أو الفائضة.','<b>يحصلون على:</b> تقليل تكلفة التخزين والإتلاف، وتقارير موثقة عن المسؤولية المجتمعية.'],['','منصة المشروع','<b>تقدّم:</b> الربط والفحص والصيانة والتعقيم والتوصيل.','<b>تحصل على:</b> إيرادات الخدمات التي تضمن الاستمرار.'],['','الجمعيات الخيرية','<b>تقدّم:</b> طلبات المحتاجين والتوزيع الموثق.','<b>تحصل على:</b> أجهزة بتكلفة أقل، وتوفير قد يصل من 60% إلى 80%.'],['','المستفيد النهائي','<b>يقدّم:</b> حاجته إلى الجهاز.','<b>يحصل على:</b> جهاز مفحوص ومعقّم يدعم رعايته في المنزل.']];

const cv=document.getElementById('cv');cv.innerHTML=S.join('');
